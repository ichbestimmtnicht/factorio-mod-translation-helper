name: Go
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
      - name: Install dependencies
        run: go get .
      - name: Build
        id: build
        uses: chihqian/gobuild-action@v0.2.0
        with:
          # bin_name: fmth
          main_go: cmd/main.go
          add_files: |
            README.md
            LICENSE
      # - name: Test
      #   run: go test
